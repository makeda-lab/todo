const input=document.getElementById('input'),chips=document.getElementById('chips'),quick=document.getElementById('quick');
let Q={due:undefined,time:undefined,remind:false,rel:null,mode:null,sched:null,area:null};

/* Kurze Beschriftungen auf schmalen Schirmen — sonst muss man wischen, und ein
   Knopf, den man erst hervorwischen muss, existiert nicht. */
const SHORT=()=>innerWidth<640;
const DATEBTN=()=>[
  ['Heute','H',today()],
  ['Morgen','Mo',addDays(today(),1)],
  ['Wochenende','WE',nextWeekday(today(),6,true)],
  ['+1 Woche','+1W',addDays(today(),7)]
];
const TIMEBTN=[['9','09:00'],['12','12:00'],['18','18:00'],['21','21:00']];
/* Relative Knöpfe: „gleich" statt „an einem Datum". Setzen Tag + Uhrzeit in
   einem Griff und schalten die Erinnerung mit ein. Nur für To-dos. */
const RELBTN=[['+5 min','+5m',5],['+10 min','+10m',10],['+1 Std','+1h',60],['+3 Std','+3h',180]];
const RHYTHM=[['Täglich','Tägl.','daily'],['Werktags','Werkt.','werktags']];

function relStamp(min){
  const d=new Date(Date.now()+min*60000);
  return{due:ymd(d),time:pad(d.getHours())+':'+pad(d.getMinutes())};
}

function eff(){
  const p=parse(input.value);
  const mode=Q.mode||(p.sched?'routine':'task');
  const sched=mode==='routine'?(Q.sched||p.sched||{kind:'daily'}):null;
  if(mode==='routine')return{mode,sched,due:null,time:null,remind:false,p};
  if(Q.rel!=null){
    const r=relStamp(Q.rel);
    return{mode,sched:null,due:r.due,time:r.time,remind:true,p};
  }
  return{
    mode,sched:null,
    due: Q.due!==undefined?Q.due:p.due,
    time:Q.time!==undefined?Q.time:p.time,
    remind: Q.remind||p.remind,
    p
  };
}
const areaChoice=()=>{
  const e=parse(input.value);
  if(e.area){const a=S.areas.find(z=>z.name.toLowerCase()===e.area.toLowerCase());if(a)return a.id}
  return Q.area||UI.pick||null;
};

function renderQuick(){
  const e=eff(),sh=SHORT(),L=(long,short)=>sh?short:long;
  const days=e.sched&&e.sched.kind==='weekdays'?e.sched.days:[];
  const isWerktags=days.length===5&&days.every(d=>d>=1&&d<=5);

  let html=`<div class="qrow">
    <span class="seg">
      <button data-mode="task" aria-pressed="${e.mode==='task'}">To-do</button>
      <button data-mode="routine" aria-pressed="${e.mode==='routine'}">Routine</button>
    </span>
    <select id="areasel" title="Bereich zuordnen">
      <option value="">Bereich…</option>
      ${S.areas.map(a=>`<option value="${a.id}"${a.id===areaChoice()?' selected':''}>${esc(pathName(a.id))}</option>`).join('')}
    </select>
  </div>`;

  if(e.mode==='routine'){
    html+=`<div class="qrow">
      ${RHYTHM.map(([l,sl,k])=>`<button data-r2="${k}" aria-pressed="${
        k==='daily'?e.sched.kind==='daily':isWerktags}">${L(l,sl)}</button>`).join('')}
      ${[1,2,3,4,5,6,0].map(w=>`<button data-w="${w}" aria-pressed="${
        !isWerktags&&days.includes(w)}">${DAY2[w]}</button>`).join('')}
    </div>`;
  } else {
    html+=`<div class="qrow">
      ${DATEBTN().map(([l,sl,d])=>`<button data-d="${d}" aria-pressed="${e.due===d&&Q.rel==null}">${L(l,sl)}</button>`).join('')}
      <button data-r="1" aria-pressed="${e.remind}" title="Erinnerung">🔔</button>
    </div><div class="qrow">
      ${TIMEBTN.map(([l,t])=>`<button data-t="${t}" aria-pressed="${e.time===t&&Q.rel==null}">${l}</button>`).join('')}
      ${RELBTN.map(([l,sl,m])=>`<button class="rel" data-rel="${m}" aria-pressed="${Q.rel===m}">${L(l,sl)}</button>`).join('')}
    </div>`;
  }
  quick.innerHTML=html;

  const out=[];
  if(e.mode==='routine')out.push(`<span class="chip">↻ Routine · ${schedLabel(e.sched)}</span>`);
  else if(e.due||e.time){
    const l=dueLabel(e.due,e.time)||(e.due?fromYmd(e.due).getDate()+'.'+(fromYmd(e.due).getMonth()+1)+'.':'')+(e.time?' '+e.time:'');
    out.push(`<span class="chip">${l.trim()}</span>`);
  }
  if(e.remind)out.push(`<span class="chip">🔔 ${LOCAL_NOTIF?'Erinnerung':'für den Kalender'}</span>`);
  const ac=areaChoice();
  if(e.p.area&&!S.areas.some(z=>z.name.toLowerCase()===e.p.area.toLowerCase()))
    out.push(`<span class="chip"><i class="swatch" style="background:var(--accent)"></i>${esc(e.p.area)} · neu</span>`);
  else if(ac)out.push(`<span class="chip"><i class="swatch" style="background:${colorOf(ac)}"></i>${esc(pathName(ac))}</span>`);
  if(!out.length&&input.value.trim())out.push('<span class="chip ghost">To-do ohne Datum</span>');
  chips.innerHTML=out.join('');
}

quick.addEventListener('change',e=>{
  if(e.target.id==='areasel'){Q.area=e.target.value||null;renderQuick();syncCapture()}
});
quick.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const cur=eff(),wasRel=Q.rel!=null;
  if(b.dataset.mode){
    Q.mode=b.dataset.mode;
    if(Q.mode==='task')Q.sched=null; else {Q.rel=null;Q.due=undefined;Q.time=undefined;Q.remind=false}
  }
  if(b.dataset.r2==='daily')   {Q.mode='routine';Q.sched={kind:'daily'}}
  if(b.dataset.r2==='werktags'){Q.mode='routine';Q.sched={kind:'weekdays',days:[1,2,3,4,5]}}
  if(b.dataset.w!==undefined){
    Q.mode='routine';
    const w=+b.dataset.w;
    let d=cur.sched&&cur.sched.kind==='weekdays'&&!(cur.sched.days.length===5&&cur.sched.days.every(x=>x>=1&&x<=5))
      ?[...cur.sched.days]:[];
    d=d.includes(w)?d.filter(x=>x!==w):[...d,w].sort();
    Q.sched=d.length?{kind:'weekdays',days:d}:{kind:'daily'};
  }
  if(b.dataset.rel){const m=+b.dataset.rel;Q.rel=Q.rel===m?null:m;Q.due=undefined;Q.time=undefined}
  if(b.dataset.d){Q.rel=null;Q.due=(!wasRel&&cur.due===b.dataset.d)?null:b.dataset.d}
  if(b.dataset.t){Q.rel=null;Q.time=(!wasRel&&cur.time===b.dataset.t)?null:b.dataset.t}
  if(b.dataset.r)Q.remind=!cur.remind;
  renderQuick();syncCapture();input.focus();
});
const clearQ=()=>{Q={due:undefined,time:undefined,remind:false,rel:null,mode:null,sched:null,area:null}};
/* „offen" heißt: Feld hat Fokus oder Inhalt, oder ein Knopf ist gedrückt.
   So verschwindet die Leiste wieder, sobald man fertig ist. */
const cap=document.querySelector('.capture');
function syncCapture(){
  const active=document.activeElement&&cap.contains(document.activeElement);
  const on=active||!!input.value.trim()||Q.rel!=null||Q.due!==undefined||Q.time!==undefined||Q.remind;
  cap.classList.toggle('open',on);
}
input.addEventListener('focus',syncCapture);
input.addEventListener('blur',()=>setTimeout(syncCapture,180));
input.addEventListener('input',()=>{renderQuick();syncCapture()});
input.addEventListener('keydown',e=>{
  if(e.key==='Escape'){input.value='';clearQ();renderQuick();input.blur();syncCapture();return}
  if(e.key!=='Enter')return;
  const s=eff(),p=s.p;
  if(!p.title)return;

  /* Bereich: getipptes #Tag schlägt die Auswahl, sonst Dropdown, sonst der
     gerade gefilterte Bereich. Ein neuer Name legt den Bereich an. */
  let areaId=null;
  if(p.area){
    let a=S.areas.find(z=>z.name.toLowerCase()===p.area.toLowerCase());
    if(!a){a={id:uid(),name:p.area,slot:(S.areas.filter(z=>!z.parent).length%6)+1,parent:null,x:null,y:null};S.areas.push(a)}
    areaId=a.id;
  } else areaId=Q.area||UI.pick||null;

  if(s.mode==='routine'){
    S.routines.push({id:uid(),title:p.title,areaId,sched:s.sched,created:today(),log:{}});
    say('Routine angelegt · '+schedLabel(s.sched),()=>S.routines.pop());
    UI.folded.rout=false;
  } else {
    const t={id:uid(),title:p.title,areaId,due:s.due,time:s.time,remind:s.remind,created:Date.now()};
    S.tasks.push(t);
    if(s.due&&diffDays(s.due,today())>0&&diffDays(s.due,today())<=7)UI.folded.soon=false;
    if(t.remind){
      arm(t);
      if(!LOCAL_NOTIF&&t.due&&t.time&&!store.get(NS+'.notifhint')){
        store.set(NS+'.notifhint','1');
        say('Hier klingelt nur der Kalender — tippe an der Aufgabe auf „🔔 Kalender"',null);
      }
    }
  }
  input.value='';clearQ();syncCapture();render();
});

/* Erinnerungen — ehrlich gehalten.
   Eine Webseite kann keine Benachrichtigung planen, die später von allein
   klingelt. Auf dem Rechner geht immerhin eine, solange die Seite offen ist.
   Auf iPhone/iPad geht auch das nicht: Safari erlaubt den Notification-
   Konstruktor dort nicht, und geplante lokale Benachrichtigungen gibt es im
   Web überhaupt nicht. Der einzige Weg, der auf dem iPhone wirklich klingelt,
   ist der Kalender — deshalb zeigt die App dort auf „🔔 Kalender". */
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)
  ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const LOCAL_NOTIF=(()=>{ try{ return typeof Notification==='function'&&!IS_IOS }catch(e){ return false } })();

function arm(t){
  if(!t.due||!t.time)return;
  if(!LOCAL_NOTIF)return;
  const go=()=>{
    const when=new Date(t.due+'T'+t.time+':00').getTime()-Date.now();
    if(when<0||when>86400000*2)return;
    setTimeout(()=>{try{new Notification(t.title,{body:'To-do Makeda · '+dueLabel(t.due,t.time)})}catch(e){}},when);
  };
  if(Notification.permission==='granted')go();
  else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')go()});
}

/* ---------- Ausgabe: Kalender, CSV, Sicherung ---------- */
/* Auf dem iPhone ist ein Download aus einer Webseite heraus unzuverlässig —
   das Teilen-Menü ist der Weg, der dort tatsächlich funktioniert (AirDrop,
   Dateien, Mail, Notizen). Am Rechner bleibt es beim normalen Download. */
function dl(name,text,mime){ return share([[name,text,mime]]) }
function share(items){
  const files=items.map(([n,t,m])=>new File([t],n,{type:m||'text/plain;charset=utf-8'}));
  if(navigator.canShare&&navigator.canShare({files})){
    navigator.share({files,title:files.length>1?'To-do Makeda — Export':files[0].name})
      .catch(()=>fallback(files));
    return 'geteilt';
  }
  fallback(files);return 'geladen';
}
function fallback(files){
  files.forEach((f,i)=>setTimeout(()=>{
    const a=el('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },i*350));
}
/* .ics ist die einzige Brücke, die eine Webseite zu iOS hat: die Datei öffnet
   den Kalender, der Termin bringt seinen eigenen Alarm mit. Direkt in
   „Erinnerungen" schreiben kann nur die native Fassung (SPEC §9). */
function ics(t){
  if(!t.due||!t.time){say('Braucht Datum und Uhrzeit',null);return}
  const st=t.due.replace(/-/g,'')+'T'+t.time.replace(':','')+'00';
  const e=new Date(t.due+'T'+t.time+':00');e.setMinutes(e.getMinutes()+15);
  const en=ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const esc2=x=>String(x).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  dl(t.title.replace(/[^\p{L}\d]+/gu,'-').slice(0,40)+'.ics',
    ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//To-do Makeda//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
     'UID:'+t.id+'@todo-makeda','DTSTAMP:'+stamp,'DTSTART:'+st,'DTEND:'+en,
     'SUMMARY:'+esc2(t.title),
     'DESCRIPTION:'+esc2('To-do Makeda'+(t.areaId?' · '+pathName(t.areaId):'')),
     'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+esc2(t.title),
     'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),
    'text/calendar;charset=utf-8');
}
/* Semikolon + BOM, damit deutsches Excel und Numbers die Datei direkt richtig
   öffnen — mit Komma landet alles in einer Spalte. */
function csvText(rows){
  const q=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
document.getElementById('csv').onclick=()=>{UI.csv=!UI.csv;UI.importer=false;render()};
function csvFiles(){
  const T=today(),f=[];
  f.push(['Aufgaben','todo-makeda-aufgaben-'+T+'.csv',csvText([
    ['Titel','Bereich','Oberbereich','Fällig','Uhrzeit','Erinnerung','Überfällig (Tage)','Angelegt'],
    ...S.tasks.map(t=>[t.title,t.areaId?areaOf(t.areaId)?.name:'',t.areaId?rootOf(t.areaId)?.name:'',
      t.due||'',t.time||'',t.remind?'ja':'',t.due&&diffDays(t.due,T)<0?-diffDays(t.due,T):'',
      new Date(t.created).toISOString().slice(0,10)])])]);
  f.push(['Routinen','todo-makeda-routinen-'+T+'.csv',csvText([
    ['Routine','Bereich','Oberbereich','Rhythmus','Serie','Quote 30 Tage (%)','Angelegt'],
    ...S.routines.map(r=>[r.title,r.areaId?areaOf(r.areaId)?.name:'',r.areaId?rootOf(r.areaId)?.name:'',
      schedLabel(r.sched),streak(r),rate(r,30)??'',r.created])])]);
  const rows=[['Datum','Wochentag','Routine','Bereich','Geplant','Erledigt']];
  S.routines.forEach(r=>{
    for(let i=89;i>=0;i--){
      const d=addDays(T,-i);
      if(diffDays(d,r.created)<0&&!r.log[d])continue;
      const pl=scheduledOn(r,d);
      if(!pl&&!r.log[d])continue;
      rows.push([d,DAY[fromYmd(d).getDay()],r.title,r.areaId?areaOf(r.areaId)?.name:'',
        pl?'ja':'nein',r.log[d]?'ja':'nein']);
    }
  });
  f.push(['Routinen-Verlauf','todo-makeda-routinen-verlauf-'+T+'.csv',csvText(rows)]);
  return f;
}
function csvPanel(){
  const f=csvFiles(),d=el('div');d.className='card';
  d.innerHTML=`<div class="cardhead"><h3>Tabellen ausgeben</h3>
      <span class="sub">Semikolon getrennt</span></div>
    ${f.map((x,i)=>`<div class="rrow" style="cursor:default">
      <div class="rname">${x[0]}<small>${x[2].split('\r\n').length-1} Zeilen</small></div>
      <button class="csvbtn" data-copy="${i}">Kopieren</button>
      <button class="csvbtn" data-file="${i}">Datei</button>
    </div>`).join('')}
    <div class="hint"><b>Auf dem iPhone:</b> „Kopieren" und in Numbers oder Google Tabellen
      einfügen — das ist der Weg, der sicher funktioniert. „Datei" zeigt der Browser oft
      nur als Text an, statt sie zu sichern.</div>
    <div class="toolbar"><button data-csvclose="1">Schließen</button></div>`;
  return d;
}

/* Wiederherstellen: Datei ODER eingefügter Text. Auf dem iPhone ist Einfügen
   oft der kürzere Weg — Sicherung in Notizen, alles markieren, hier hinein. */
function importPanel(){
  const d=el('div');d.className='card';
  d.innerHTML=`<div class="cardhead"><h3>Daten wiederherstellen</h3>
      <span class="sub">überschreibt alles, was gerade drin ist</span></div>
    <div class="toolbar" style="margin-top:10px">
      <button id="pickfile">Sicherungsdatei wählen</button>
      <button id="closeimp">Abbrechen</button>
    </div>
    <label style="display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
      color:var(--muted);font-weight:600;margin:14px 0 6px">oder Inhalt hier einfügen</label>
    <textarea id="pastebox" rows="4" placeholder='{"app":"todo-makeda", …}'
      style="width:100%;font:inherit;font-size:.85rem;font-family:ui-monospace,Menlo,monospace;
      padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:var(--surface-2);color:var(--text);outline:none;resize:vertical"></textarea>
    <div class="toolbar" style="margin-top:9px">
      <button id="dopaste">Einfügen und übernehmen</button>
    </div>
    <div class="hint">Vorher lohnt sich eine Sicherung des jetzigen Standes —
      Rückgängig gibt es nur für einen Schritt.</div>`;
  return d;
}

/* Export / Import / Beispiele */
document.getElementById('exp').onclick=()=>{
  const how=dl('todo-makeda-sicherung-'+today()+'.json',
     JSON.stringify({app:'todo-makeda',v:2,exported:new Date().toISOString(),data:S},null,2),
     'application/json');
  store.set(NS+'.backup',today());
  say(how==='geteilt'?'Sicherung im Teilen-Menü — in „Dateien" legen':'Sicherung geladen',null);
  render();
};
/* Der kürzeste Weg, Daten von Safari in die Homescreen-App zu bekommen:
   hier kopieren, dort unter Import einfügen. Dateien hin- und herschieben ist
   auf dem iPhone der längere Weg. */
document.getElementById('copy').onclick=async()=>{
  const text=JSON.stringify({app:'todo-makeda',v:2,exported:new Date().toISOString(),data:S},null,2);
  try{
    await navigator.clipboard.writeText(text);
    store.set(NS+'.backup',today());
    say('Kopiert — in der anderen Fassung auf „Import" und einfügen',null);
  }catch(e){
    const t=el('textarea');t.value=text;t.style.cssText='position:fixed;top:-1000px';
    document.body.appendChild(t);t.select();
    try{document.execCommand('copy');say('Kopiert',null)}catch(e2){say('Kopieren ging nicht — nimm „Sicherung"',null)}
    t.remove();
  }
  render();
};
/* Die Homescreen-App holt sich dieselbe Seite, hält sie aber gern im Zwischen-
   speicher. Ein Tipp auf die Versionsnummer erzwingt eine frische Fassung. */
(function(){
  const v=document.getElementById('ver');
  v.textContent='v'+APP_VERSION;
  v.onclick=()=>{location.replace(location.pathname+'?v='+Date.now())};
})();
function backupAge(){
  const b=store.get(NS+'.backup');
  return b?diffDays(today(),b):null;
}
function loadBackup(text){
  try{
    const d=JSON.parse(text);
    const data=d&&d.data&&d.data.areas?d.data:(d&&d.areas?d:null);
    if(!data)return false;
    const old=S;
    S=data;S.links=S.links||[];S.doneLog=S.doneLog||{};
    UI.pick=null;UI.editR=null;
    say('Daten übernommen',()=>{S=old});render();return true;
  }catch(e){return false}
}
document.getElementById('imp').onclick=()=>{
  UI.importer=!UI.importer;render();
  if(UI.importer)setTimeout(()=>{const t=document.getElementById('pastebox');if(t)t.focus()},30);
};
document.getElementById('seedoff').onclick=()=>{
  const old=S;S=BLANK();
  UI.pick=null;say('Beispiele entfernt — Bereiche bleiben',()=>{S=old});render();
};

/* Boot */
(function(){
  const d=new Date(),h=d.getHours();
  document.getElementById('today').textContent=DAY[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()];
  document.getElementById('greeting').textContent=h<11?'Guten Morgen':h<18?'Heute':'Guten Abend';
  /* Auf dem Handy startet die Karte etwas herangezoomt — sonst ist alles
     briefmarkengroß. Nur beim allerersten Mal, danach gilt deine Einstellung. */
  if(!UI.camInit){
    UI.camInit=true;
    if(innerWidth<640){const z=1.3;UI.cam={x:MCX*(1-z),y:MCY*(1-z),z}}
  }
  render();syncCapture();
  if(!('ontouchstart'in window))input.focus();
})();
</script>
