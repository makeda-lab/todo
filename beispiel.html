<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-do Makeda">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
<title>To-do Makeda — Routinen, To-dos, Bereiche</title>
<style>
:root{
  color-scheme: light;
  --bg:#faf9f7; --surface:#ffffff; --surface-2:#f2f0ec;
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781; --faint:#b8b2a8;
  --line:#e1e0d9; --accent:#3f6b53; --accent-soft:#e8f0ea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 6px 20px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#171613; --surface:#201f1b; --surface-2:#282721;
    --text:#f5f2ec; --text-2:#c3c2b7; --muted:#918b80; --faint:#5f5a52;
    --line:#302e28; --accent:#7fb394; --accent-soft:#232f28;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:110px}
.wrap{max-width:700px;margin:0 auto;padding:0 18px}

header{padding:24px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.date{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:1.5rem;margin:0;font-weight:640;letter-spacing:-.015em}

.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:11px;padding:3px;margin:14px 0 0}
.tabs button{flex:1;font:inherit;font-size:.87rem;font-weight:560;border:0;border-radius:8px;
  padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs.arrange{flex-wrap:wrap}
.tabs.arrange button{background:var(--surface);color:var(--text);box-shadow:none;
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:.8rem;
  flex:1 1 46%}
.tabs.arrange i{font-style:normal;color:var(--accent);font-size:.95rem;padding:0 3px}
.tabs .handle{flex:0 0 38px;color:var(--faint);font-size:.95rem}
.tabs.arrange .handle{background:var(--accent);color:#fff;box-shadow:none;flex:1 1 100%}

/* ---------- Verlauf ---------- */
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tile{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.tile b{display:block;font-size:1.7rem;font-weight:640;letter-spacing:-.02em;line-height:1.15}
.tile span{font-size:.75rem;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:inherit}
.gridline{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:10.5px}
.serie{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--surface);stroke-width:2}
.cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chartlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:.76rem;color:var(--text-2)}
.chartlegend span{display:inline-flex;align-items:center;gap:6px}
.chartlegend i{width:11px;height:3px;border-radius:2px;display:block}

/* ---------- Erfassung ---------- */
.capture{position:sticky;top:0;z-index:30;padding:12px 0 10px;background:var(--bg)}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field .plus{color:var(--faint);font-size:1.2rem;line-height:1;flex:none}
#input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:1.05rem;outline:none;min-width:0}
#input::placeholder{color:var(--faint)}
.quick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick button{font:inherit;font-size:.8rem;font-weight:540;padding:7px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);white-space:nowrap;
  min-height:34px;transition:.12s}
.quick button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.quick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.quick button.rel[aria-pressed="true"]{background:var(--s2);border-color:var(--s2)}
.quick button:disabled{opacity:.35;cursor:default}
.quick .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 3px;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);min-height:30px;padding:5px 13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:hover:not([aria-pressed="true"]){color:var(--accent)}
#areasel{font:inherit;font-size:.8rem;font-weight:540;padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);min-height:34px;
  max-width:46%;cursor:pointer}
#areasel:focus{outline:none;border-color:var(--accent)}
.qnote{font-size:.75rem;color:var(--muted);padding-left:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-weight:560;display:inline-flex;align-items:center;gap:5px}
.chip.ghost{background:var(--surface-2);color:var(--muted);font-weight:500}
.swatch{width:8px;height:8px;border-radius:50%;flex:none}

@media (max-width:640px){
  /* Auf dem Handy sitzt das Feld unten in der Daumenzone. Die Knopfreihen
     erscheinen erst beim Tippen — sonst nähmen sie ein Drittel des Schirms
     weg, ohne dass man sie gerade braucht. Wenn sie da sind, sind sie
     vollständig da: umbrechen statt seitlich wegscrollen. */
  .capture{position:fixed;top:auto;bottom:0;left:0;right:0;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.10);
    display:flex;flex-direction:column-reverse;gap:7px}
  .capture .field{order:3;padding:11px 13px}
  .quick,.chips{margin:0}
  .quick{display:none}
  .capture.open .quick{display:flex}
  .qrow{flex-wrap:wrap;overflow:visible}
  .quick button{font-size:.78rem;padding:6px 11px;min-height:32px}
  .quick .sep{display:none}
  .chips{display:none}
  .capture.open .chips{display:flex}
  .tabs button{font-size:.8rem;padding:8px 2px}
  /* Die Karte darf nicht die ganze Höhe fressen — Werkzeugleiste und Liste
     darunter müssen ohne Scrollen sichtbar bleiben. */
  .card{padding:13px}
  .mapwrap{margin-top:8px}
  .hint{margin-top:7px;font-size:.74rem}
  .tabs .handle{flex:0 0 30px;font-size:.85rem}
  header{padding:18px 0 2px}
  h1{font-size:1.3rem}
  footer{margin-top:26px;gap:10px 14px}
  body{padding-bottom:104px}
  .capture.open ~ * {}
}


/* ---------- Listen ---------- */
section{margin-top:22px}
.sechead{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none;padding:2px 2px 8px}
.sechead h2{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:640}
.sechead .count{font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums}
.sechead .caret{margin-left:auto;color:var(--faint);font-size:.7rem;transition:transform .18s}
.collapsed .caret{transform:rotate(-90deg)}
.collapsed .list{display:none}
.list{display:flex;flex-direction:column;gap:1px}

.item{display:flex;align-items:flex-start;gap:11px;padding:10px 11px;border-radius:11px;
  transition:background .12s,opacity .24s,transform .24s}
/* Routinenzeilen sind hoch (Titel + Bereich + Streifen). Der Kreis sitzt dann
   mittig zum ganzen Block statt oben in der Ecke — sonst zielt man ins Leere. */
.item[data-rid]{align-items:center}
.item[data-rid] .box{margin-top:0}
.item:hover{background:var(--surface)}
.item.going{opacity:0;transform:translateX(14px)}
.box{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.8px solid var(--faint);
  cursor:pointer;position:relative;transition:border-color .15s}
.box:hover{border-color:var(--accent)}
.box.rep{border-style:dashed}
.box::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);
  transform:scale(0);transition:transform .18s}
.box.on::after,.item.going .box::after{transform:scale(1)}
.box.on{border-color:var(--accent)}
.body{flex:1;min-width:0}
.title{outline:none;word-break:break-word}
.title[contenteditable]:focus{background:var(--surface-2);border-radius:5px;box-shadow:0 0 0 4px var(--surface-2)}
.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:.77rem;color:var(--muted);margin-top:3px}
.meta .rep{color:var(--accent)}
.meta .old{color:var(--faint)}
.meta .lnk{font:inherit;font-size:.77rem;background:none;border:0;padding:0;cursor:pointer;
  color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;color:var(--text-2)}
.kill{flex:none;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:1.1rem;
  line-height:1;padding:4px 7px;opacity:0;transition:opacity .12s}
.item:hover .kill{opacity:1}
.nudge{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.nudge button{font:inherit;font-size:.76rem;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);min-height:30px}
.nudge button:hover{border-color:var(--accent);color:var(--accent)}
.nudge span{font-size:.75rem;color:var(--faint)}
.empty{color:var(--faint);font-size:.88rem;padding:6px 11px}

/* ---------- Karten / Grafik ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.cardhead{display:flex;align-items:center;gap:9px}
.cardhead h3{margin:0;font-size:.98rem;font-weight:620}
.cardhead .sub{margin-left:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

.rrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rrow:first-of-type{border-top:0}
.rname{flex:1;min-width:0;font-size:.92rem}
.rname small{display:block;color:var(--muted);font-size:.74rem}
.brk{display:none}
.stat{text-align:right;font-variant-numeric:tabular-nums;flex:none;min-width:48px}
.stat b{font-size:1.02rem;font-weight:620;display:block;line-height:1.2}
.stat small{color:var(--muted);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase}

.grid{display:grid;grid-template-columns:repeat(7,14px);gap:5px;flex:none}
.cell{width:14px;height:14px;border-radius:4px;cursor:pointer;transition:transform .1s}
.cell:active{transform:scale(.82)}
.cell.done{background:var(--c)}
.cell.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.cell.off{background:var(--surface-2);cursor:default}
.cell.future{opacity:.3;cursor:default;background:var(--surface-2)}
.cell.today{outline:1.5px solid var(--accent);outline-offset:1.5px}
.strip{display:flex;gap:4px;align-items:center}
.strip .cell{width:11px;height:11px;border-radius:3px}

.bars{display:flex;align-items:flex-end;gap:3px;height:38px;flex:none}
.bar{width:9px;border-radius:3px 3px 0 0;background:var(--c);min-height:2px;opacity:.85}
.bar.now{opacity:1}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{width:11px;height:11px;border-radius:3px;background:var(--muted)}
.lk.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.lk.off{background:var(--surface-2)}

.editor{background:var(--surface-2);border-radius:11px;padding:13px;margin:0 0 10px}
.editor label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:600;margin:11px 0 6px}
.editor label:first-child{margin-top:0}
.editor input[type=text],.editor select,.editor input[type=number]{font:inherit;font-size:.92rem;padding:8px 11px;
  border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);width:100%}
.editor input[type=number]{width:74px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:inherit;font-size:.8rem;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:34px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2)}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pills .dan{color:#d03b3b;border-color:transparent;background:transparent;margin-left:auto}

table.tv{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px}
table.tv th,table.tv td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.tv th{color:var(--muted);font-weight:560;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}

/* ---------- Mindmap ---------- */
.mapwrap{position:relative;background:var(--surface-2);border-radius:12px;overflow:hidden;margin-top:10px}
svg.map{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
.mapwrap.tall svg.map{height:44vh}
svg.map.grabbing{cursor:grabbing}
svg.map text{font-family:inherit;paint-order:stroke;stroke:var(--surface-2);stroke-width:4px;
  stroke-linejoin:round;user-select:none;pointer-events:none}
.node{cursor:grab}
.node.dragging{cursor:grabbing}
.node circle.bub{transition:opacity .18s}
.dim{opacity:.3}
.plusbtn circle.pb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.cut{cursor:pointer}
.cut circle.cb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.cut:hover circle.cb{stroke:#d03b3b}
.cut path{stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.cut:hover path{stroke:#d03b3b}
.plusbtn:hover circle.pb{stroke:var(--accent)}
.plusbtn path{stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.plusbtn:hover path{stroke:var(--accent)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);font:inherit;font-size:1.05rem;cursor:pointer;line-height:1;box-shadow:var(--shadow)}
.hint{font-size:.76rem;color:var(--muted);margin-top:9px}
.hint b{color:var(--accent)}

.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.toolbar button{font:inherit;font-size:.8rem;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:34px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2)}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toolbar .dan{color:#d03b3b}
.csvbtn{font:inherit;font-size:.8rem;padding:7px 14px;border-radius:999px;cursor:pointer;
  min-height:34px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);flex:none}
.csvbtn:hover{border-color:var(--accent);color:var(--accent)}
.inline{display:flex;gap:7px;margin-top:11px}
.inline input{flex:1;font:inherit;font-size:.95rem;padding:9px 12px;border-radius:10px;
  border:1px solid var(--accent);background:var(--surface);color:var(--text);outline:none}
.inline button{font:inherit;font-size:.85rem;padding:9px 15px;border-radius:10px;border:0;
  background:var(--accent);color:#fff;cursor:pointer;font-weight:560}

.help{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:.85rem;color:var(--muted)}
.help b{color:var(--text);font-weight:560}
.help code{background:var(--surface-2);padding:1px 6px;border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;color:var(--text)}
.help div{margin-top:6px}

footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);display:flex;gap:14px;
  align-items:center;flex-wrap:wrap;font-size:.77rem;color:var(--faint)}
footer button{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
footer button:hover{color:var(--accent)}
.spacer{margin-left:auto}

#tip{position:fixed;pointer-events:none;z-index:60;background:var(--text);color:var(--bg);
  font-size:.76rem;padding:7px 11px;border-radius:8px;opacity:0;transition:opacity .12s;
  white-space:nowrap;line-height:1.55;text-align:left;box-shadow:var(--shadow)}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,180%);background:var(--text);
  color:var(--bg);border-radius:999px;padding:11px 18px;font-size:.85rem;display:flex;gap:14px;
  align-items:center;box-shadow:var(--shadow);z-index:70;visibility:hidden;opacity:0;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s,visibility 0s .2s}
#toast.on{transform:translate(-50%,0);visibility:visible;opacity:1;transition-delay:0s}
@media (max-width:640px){ #toast{bottom:calc(160px + env(safe-area-inset-bottom))} }
#toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:640;
  cursor:pointer;text-decoration:underline;padding:0}
/* Zuletzt, damit diese Regeln die allgemeinen überschreiben. */
@media (pointer:coarse){
  .box{width:28px!important;height:28px!important}
  .item{padding:13px 10px}
  .kill{opacity:.5!important}
  /* Ein 14-px-Kästchen trifft man mit dem Daumen nicht. Der Name bekommt eine
     eigene Zeile, damit darunter Platz für ein ordentliches Raster ist. */
  .rrow{flex-wrap:wrap;row-gap:11px;padding:13px 0;gap:8px}
  .rname{flex:1 1 auto}
  .brk{display:block;flex:1 0 100%;height:0}   /* Zeilenumbruch nach dem Namen */
  .grid{grid-template-columns:repeat(7,23px);gap:7px;margin-right:auto}
  .cell{width:23px;height:23px;border-radius:6px}
  .strip .cell{width:20px;height:20px;border-radius:5px}
  .stat{min-width:46px}
  .legend .lk{width:14px;height:14px;border-radius:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="greeting">Heute</h1>
    <span class="date" id="today"></span>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="capture">
    <div class="field">
      <span class="plus">+</span>
      <input id="input" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Was steht an?">
    </div>
    <div class="quick" id="quick"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="board"></div>

  <footer>
    <span id="stat"></span>
    <span class="spacer"></span>
    <button id="ver" title="Antippen lädt die neueste Fassung">v?</button>
    <button id="arrange">Reiter</button>
    <button id="exp">Sicherung</button>
    <button id="copy">Kopieren</button>
    <button id="csv">CSV</button>
    <button id="imp">Import</button>
    <button id="seedoff">Beispiele weg</button>
  </footer>
</div>

<div id="tip"></div>
<div id="toast"><span id="toasttext"></span><button id="undo">Rückgängig</button></div>

<script>
/* =========================================================================
   To-do Makeda — v0.5  ·  Routinen + To-dos + Bereiche über EINEM Datenmodell
   Datenmodell & Regeln: SPEC.md
   ========================================================================= */

/* --- Bau-Schalter. Die leere Fassung wird daraus erzeugt (build.sh),
       damit beide Fassungen nie auseinanderlaufen. --- */
const WITH_EXAMPLES=true;
const APP_VERSION='1.4';
const NS='todo-makeda-beispiel';

const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');

/* ---------- Datum ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=fromYmd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  const l=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,l));return ymd(d)};
const diffDays=(a,b)=>Math.round((fromYmd(a)-fromYmd(b))/864e5);
const DAY=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DAY2=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function nextWeekday(from,wd,incl=false){const d=fromYmd(from);let k=(wd-d.getDay()+7)%7;
  if(k===0&&!incl)k=7;d.setDate(d.getDate()+k);return ymd(d)}
const startOfWeek=s=>addDays(s,-((fromYmd(s).getDay()+6)%7));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const el=t=>document.createElement(t);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Parser ---------- */
const WD={sonntag:0,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6,sonnabend:6};
const WDL='montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonnabend|sonntag';
const WD2={so:0,mo:1,di:2,mi:3,'do':4,fr:5,sa:6};

function parse(raw){
  let s=' '+raw+' ';
  let due=null,time=null,sched=null,area=null,remind=false;
  const eat=(re,fn)=>{let hit=false;
    s=s.replace(re,(...a)=>{if(hit)return a[0];hit=true;fn(a);return ' '});return hit};

  eat(/#([\p{L}][\p{L}\d_-]*)/u,a=>area=a[1]);
  eat(/\b(?:erinnere?\s*mich|erinnerung|reminder|!!)\b/i,()=>remind=true);

  eat(new RegExp('\\b(?:jeden|jede[nsm]?)\\s+('+WDL+')e?n?\\b','i'),
      a=>sched={kind:'weekdays',days:[WD[a[1].toLowerCase()]]})
  || eat(new RegExp('\\b('+WDL.replace(/\|/g,'s|')+'s)\\b','i'),
      a=>sched={kind:'weekdays',days:[WD[a[1].toLowerCase().replace(/s$/,'')]]})
  || eat(/\b(mo|di|mi|do|fr|sa|so)(?:\s*[+,/ ]\s*(mo|di|mi|do|fr|sa|so)){1,6}\b/i,a=>{
      const d=a[0].toLowerCase().match(/mo|di|mi|do|fr|sa|so/g).map(x=>WD2[x]);
      sched={kind:'weekdays',days:[...new Set(d)].sort()}})
  || eat(/\ball(?:e)?\s+(\d+)\s*(tage?n?|wochen?)\b/i,a=>{
      const n=+a[1];sched={kind:'interval',n:a[2].toLowerCase().startsWith('woch')?n*7:n}})
  || eat(/\b(?:jeden\s+tag|t(?:ä|ae)glich|daily)\b/i,()=>sched={kind:'daily'})
  || eat(/\b(?:jede\s+woche|w(?:ö|oe)chentlich)\b/i,()=>sched={kind:'interval',n:7})
  || eat(/\bwerktags\b|\bunter\s*der\s*woche\b/i,()=>sched={kind:'weekdays',days:[1,2,3,4,5]});

  eat(/\bum\s+(\d{1,2})(?:[:.](\d{2}))?\s*(?:uhr)?\b/i,a=>time=pad(+a[1])+':'+(a[2]||'00'))
  || eat(/\b(\d{1,2})[:.](\d{2})\s*uhr\b/i,a=>time=pad(+a[1])+':'+a[2])
  || eat(/\b(\d{1,2})\s*uhr\b/i,a=>time=pad(+a[1])+':00');

  const T=today();
  eat(/(?:ü|ue)bermorgen/i,()=>due=addDays(T,2))
  || eat(/\bmorgen\b/i,()=>due=addDays(T,1))
  || eat(/\bheute\b/i,()=>due=T)
  || eat(/\bin\s+(\d+)\s*(tag(?:en)?|wochen?|monat(?:en)?)\b/i,a=>{
      const n=+a[1],u=a[2].toLowerCase();
      due=u.startsWith('tag')?addDays(T,n):u.startsWith('woch')?addDays(T,n*7):addMonths(T,n)})
  || eat(/\b(?:n(?:ä|ae)chste|kommende)\s+woche\b/i,()=>due=addDays(T,7))
  || eat(/\bwochenende\b/i,()=>due=nextWeekday(T,6,true))
  || eat(/\b(?:am\s+)?(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})?/,a=>{
      const d=+a[1],m=+a[2];
      let y=a[3]?(+a[3]<100?2000+ +a[3]:+a[3]):new Date().getFullYear();
      let c=y+'-'+pad(m)+'-'+pad(d);
      if(!a[3]&&diffDays(c,T)<0)c=(y+1)+'-'+pad(m)+'-'+pad(d);
      due=c})
  || eat(new RegExp('\\b(?:am\\s+|n(?:ä|ae)chsten\\s+|kommenden\\s+)?('+WDL+')\\b','i'),
      a=>due=nextWeekday(T,WD[a[1].toLowerCase()],false));

  const title=s.replace(/\s+/g,' ').trim().replace(/[\s,;–-]+$/,'')
    .replace(/^(?:am|um|bis|und|in)\s+/i,'').replace(/\s+(?:am|um|bis|in)$/i,'').trim();

  return{title,due,time,sched,area,remind,type:sched?'routine':'task'};
}

/* ---------- Zeitplan ---------- */
function scheduledOn(r,date){
  if(diffDays(date,r.created)<0)return false;
  if(r.sched.kind==='daily')return true;
  if(r.sched.kind==='weekdays')return r.sched.days.includes(fromYmd(date).getDay());
  return diffDays(date,r.created)%r.sched.n===0;
}
function schedLabel(s){
  if(!s)return'';
  if(s.kind==='daily')return'täglich';
  if(s.kind==='weekdays'){
    if(s.days.length===7)return'täglich';
    if(s.days.length===5&&s.days.every(d=>d>=1&&d<=5))return'werktags';
    if(s.days.length===1)return'jeden '+DAY[s.days[0]];
    return s.days.map(d=>DAY2[d]).join(' · ');
  }
  return s.n===7?'wöchentlich':`alle ${s.n} Tage`;
}
/* Serie: ein abgehakter Tag zählt, egal ob er geplant war — sonst wäre
   Nachtragen sinnlos. Abgebrochen wird nur an einem geplanten Tag ohne Haken. */
function streak(r){
  let n=0,d=today();
  if(scheduledOn(r,d)&&!r.log[d])d=addDays(d,-1);
  const first=Object.keys(r.log).sort()[0]||r.created;
  for(let i=0;i<800;i++){
    if(diffDays(d,first)<0&&diffDays(d,r.created)<0)break;
    if(r.log[d])n++;
    else if(scheduledOn(r,d))break;
    d=addDays(d,-1);
  }
  return n;
}
function rate(r,days=30){let h=0,p=0;
  for(let i=0;i<days;i++){const d=addDays(today(),-i);
    if(scheduledOn(r,d)||r.log[d]){p++;if(r.log[d])h++}}
  return p?Math.round(h/p*100):null}
function areaRate(ids,w){ return listRate(S.routines.filter(r=>ids.includes(r.areaId)),w) }
function listRate(rs,w){
  const end=addDays(startOfWeek(today()),-7*w);
  let h=0,p=0;
  rs.forEach(r=>{for(let i=0;i<7;i++){const d=addDays(end,i);
    if(diffDays(d,today())>0)continue;
    if(scheduledOn(r,d)||r.log[d]){p++;if(r.log[d])h++}}});
  return p?h/p:null;
}

const areaOf=id=>S.areas.find(a=>a.id===id);
const rootOf=id=>{let a=areaOf(id);let g=0;while(a&&a.parent&&g++<10)a=areaOf(a.parent);return a};
const colorOf=id=>{const r=rootOf(id);return r&&r.slot?`var(--s${r.slot})`:'var(--muted)'};
const kidsOf=id=>S.areas.filter(a=>a.parent===id);
const subtree=id=>[id,...kidsOf(id).map(k=>k.id)];
const pathName=id=>{const a=areaOf(id);if(!a)return'';const p=a.parent&&areaOf(a.parent);
  return p?p.name+' › '+a.name:a.name};

function dueLabel(due,time){
  if(!due)return time||'';
  const d=diffDays(due,today());
  let s;
  if(d===0)s='heute';else if(d===1)s='morgen';else if(d===2)s='übermorgen';
  else if(d>2&&d<7)s=DAY[fromYmd(due).getDay()];
  else if(d<0)s='';
  else{const t=fromYmd(due);s=t.getDate()+'. '+MON[t.getMonth()].slice(0,3)}
  return s+(time?(s?' ':'')+time:'');
}

const board=document.getElementById('board');

  renderTabs();

  document.getElementById('stat').innerHTML=
    (doneToday?`${doneToday} heute erledigt · ${S.tasks.length} offen`
              :`${S.tasks.length} offen · ${S.routines.length} Routinen`)

        ? (S.tasks.length+S.routines.length>3?` · <b style="color:var(--accent)">noch nie gesichert</b>`:'')

        : age>14?` · <b style="color:var(--accent)">Sicherung ist ${age} Tage alt</b>`
        : ` · vor ${age} Tag${age>1?'en':''} gesichert`);
  document.getElementById('seedoff').style.display=S.seeded?'':'none';
  renderQuick();
  save();
}

/* ---------- HEUTE ---------- */
function viewHeute(){
  const T=today();
  const due=S.routines.filter(r=>scheduledOn(r,T));
  if(due.length){
    const sec=el('section');
    sec.innerHTML=`<div class="sechead" data-fold="rout"><h2>Routinen heute</h2>
      <span class="count">${due.filter(r=>r.log[T]).length}/${due.length}</span><span class="caret">▾</span></div>
      <div class="list"></div>`;
    if(UI.folded.rout)sec.className='collapsed';
    due.forEach(r=>sec.querySelector('.list').appendChild(routineRow(r)));
    board.appendChild(sec);
  }
  const g={now:[],soon:[],later:[]};
  S.tasks.forEach(t=>{
    if(!t.due)return g.later.push(t);
    const d=diffDays(t.due,T);(d<=0?g.now:d<=7?g.soon:g.later).push(t);
  });
  const ord=t=>t.due?diffDays(t.due,T):9999;
  Object.values(g).forEach(a=>a.sort((x,y)=>ord(x)-ord(y)||x.created-y.created));
  [['now','Jetzt'],['soon','Demnächst'],['later','Später']].forEach(([k,label])=>{
    if(!g[k].length&&k!=='now')return;
    const sec=el('section');
    if(UI.folded[k]&&g[k].length)sec.className='collapsed';
    sec.innerHTML=`<div class="sechead" data-fold="${k}"><h2>${label}</h2>
      <span class="count">${g[k].length||''}</span><span class="caret">▾</span></div><div class="list"></div>`;
    const list=sec.querySelector('.list');
    if(!g[k].length)list.innerHTML='<div class="empty">Nichts offen. Schön.</div>';
    else g[k].forEach(t=>list.appendChild(taskRow(t)));
    board.appendChild(sec);
  });
  if(!S.tasks.length&&!S.routines.length){
    const h=el('div');h.className='help';
    h.innerHTML=`<b>Ein Feld für alles. Was du tippst, entscheidet was daraus wird:</b>
      <div><code>Zahnarzt anrufen morgen um 9</code> → To-do</div>
      <div><code>20 Seiten lesen täglich #Lernen</code> → Routine mit Punkte-Verlauf</div>
      <div>Oder einfach tippen und unten auf die Knöpfe drücken.</div>`;
    board.appendChild(h);
  }
}

function routineRow(r){
  const T=today(),on=!!r.log[T],st=streak(r);
  const d=el('div');d.className='item'+(on?' done':'');d.dataset.rid=r.id;
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(T,-i));
  d.innerHTML=`<div class="box rep${on?' on':''}" title="Heute abhaken"></div>
    <div class="body">
      <div class="title" contenteditable="plaintext-only">${esc(r.title)}</div>
      <div class="meta">
        ${r.areaId?`<span class="tag"><i class="swatch" style="background:${colorOf(r.areaId)}"></i>${esc(pathName(r.areaId))}</span>`:''}
        <span class="rep">↻ ${schedLabel(r.sched)}</span>
        ${st?`<span>${st} Tag${st>1?'e':''} Serie</span>`:''}
        <span class="strip">${days.map(x=>cell(r,x,colorOf(r.areaId))).join('')}</span>
      </div>
    </div><button class="kill" title="Routine löschen">×</button>`;
  return d;
}
function cell(r,date,c){
  const fut=diffDays(date,today())>0;
  const state=fut?'future':r.log[date]?'done':scheduledOn(r,date)?'miss':'off';
  const t=fromYmd(date);
  const lbl=DAY2[t.getDay()]+' '+t.getDate()+'.'+(t.getMonth()+1)+'. — '+
    (state==='done'?'erledigt · tippen nimmt es zurück'
     :state==='miss'?'ausgelassen · tippen trägt nach'
     :state==='off'?'nicht geplant · tippen trägt trotzdem nach'
     :'liegt in der Zukunft');
  return `<i class="cell ${state}${date===today()?' today':''}" style="--c:${c}"
    data-day="${date}" data-tip="${lbl}"></i>`;
}

function taskRow(t){
  const T=today(),stale=t.due?-diffDays(t.due,T):0,bits=[];
  if(t.areaId)bits.push(`<span class="tag"><i class="swatch" style="background:${colorOf(t.areaId)}"></i>${esc(pathName(t.areaId))}</span>`);
  const dl=dueLabel(t.due,t.time);if(dl)bits.push(`<span>${dl}</span>`);
  if(t.remind)bits.push(t.due&&t.time
    ? `<button class="lnk" data-ics="1" title="Als Termin mit Alarm in den Kalender legen">🔔 Kalender</button>`
    : `<span title="Erinnerung">🔔</span>`);
  if(stale>0&&stale<7)bits.push(`<span class="old">seit ${stale} Tag${stale>1?'en':''}</span>`);
  const d=el('div');d.className='item';d.dataset.tid=t.id;
  d.innerHTML=`<div class="box" title="Erledigt"></div>
    <div class="body">
      <div class="title" contenteditable="plaintext-only">${esc(t.title)}</div>
      ${bits.length?`<div class="meta">${bits.join('')}</div>`:''}
      ${stale>=7?`<div class="nudge"><span>liegt seit ${stale} Tagen —</span>
        <button data-act="today">heute</button><button data-act="week">nächste Woche</button>
        <button data-act="drop">weg damit</button></div>`:''}
    </div><button class="kill" title="Löschen">×</button>`;
  return d;
}

function viewRoutinen(){

    board.innerHTML='<div class="help">Noch keine Routine. Tippe oben z.&nbsp;B. <code>20 Seiten lesen täglich #Lernen</code>.</div>';

  const tb=el('div');tb.className='toolbar';
  tb.innerHTML=`<button id="tgtable" aria-pressed="${UI.table}">Als Tabelle</button>
    <span class="hint" style="margin:0">Kästchen antippen trägt einen Tag nach.</span>`;
  board.appendChild(tb);

  const roots=S.areas.filter(a=>!a.parent);
  const groups=roots.map(r=>({root:r,ids:subtree(r.id)}))
    .filter(g=>S.routines.some(r=>g.ids.includes(r.areaId)));
  const orphan=S.routines.filter(r=>!r.areaId||!areaOf(r.areaId));
  if(orphan.length)groups.push({root:null,ids:[null]});

  let first=true;
  groups.forEach(({root,ids})=>{
    const rs=root?S.routines.filter(r=>ids.includes(r.areaId)):orphan;
    const c=root?`var(--s${root.slot})`:'var(--muted)';
    const card=el('div');card.className='card';
    const weeks=[7,6,5,4,3,2,1,0].map(w=>areaRate(ids,w));
    const cur=weeks[7];
    card.innerHTML=`<div class="cardhead">
        <i class="swatch" style="background:${c};width:11px;height:11px"></i>
        <h3>${esc(root?root.name:'Ohne Bereich')}</h3>
        <span class="sub">${cur==null?'—':Math.round(cur*100)+'% diese Woche'}</span></div>`;
    if(weeks.some(w=>w!=null)){
      const w=el('div');w.style.cssText='display:flex;align-items:flex-end;gap:12px;margin:11px 0 5px';
      w.innerHTML=`<div class="bars">${weeks.map((v,i)=>
        `<i class="bar${i===7?' now':''}" style="--c:${v==null?'var(--line)':c};height:${v==null?2:Math.max(2,v*38)}px"
          data-tip="${i===7?'diese Woche':`vor ${7-i} Woche${7-i>1?'n':''}`} — ${v==null?'nichts geplant':Math.round(v*100)+'% erfüllt'}"></i>`).join('')}</div>
        <span style="font-size:.72rem;color:var(--muted)">8 Wochen · Erfüllungsquote</span>`;
      card.appendChild(w);

/* =========================================================================
   VERLAUF — wie es sich über die Wochen entwickelt hat
   ========================================================================= */
const WEEKS=12;
function weekStarts(n){
  const out=[],base=startOfWeek(today());
  for(let i=n-1;i>=0;i--)out.push(addDays(base,-7*i));
  return out;
}
function weekLabel(ws){
  const d=fromYmd(ws),k=diffDays(startOfWeek(today()),ws)/7;
  return k===0?'diese Woche':`${d.getDate()}. ${MON[d.getMonth()].slice(0,3)}`;
}
function seriesForAreas(){
  const ws=weekStarts(WEEKS);
  const line=(name,color,rs)=>({name,color,values:ws.map(w=>{
    const v=listRate(rs,diffDays(startOfWeek(today()),w)/7);
    return v==null?null:v*100;
  })});
  const out=S.areas.filter(a=>!a.parent)
    .map(a=>({a,ids:subtree(a.id)}))
    .filter(o=>S.routines.some(r=>o.ids.includes(r.areaId)))
    .map(o=>line(o.a.name,`var(--s${o.a.slot})`,S.routines.filter(r=>o.ids.includes(r.areaId))));
  /* Routinen ohne Bereich fielen bisher komplett aus dem Diagramm — dann stand
     dort „keine Routinen", obwohl es welche gab. */
  const lose=S.routines.filter(r=>!r.areaId||!areaOf(r.areaId));
  if(lose.length)out.push(line('Ohne Bereich','var(--muted)',lose));
  return out;
}
function tasksPerWeek(){
  return weekStarts(WEEKS).map(w=>{
    let n=0;for(let i=0;i<7;i++){const d=addDays(w,i);n+=S.doneLog[d]||0}
    return n;
  });
}

function viewVerlauf(){
  const ws=weekStarts(WEEKS),series=seriesForAreas(),done=tasksPerWeek();
  const best=S.routines.reduce((m,r)=>Math.max(m,streak(r)),0);
  const cur=listRate(S.routines,0),prev=listRate(S.routines,1);

  const tiles=el('div');tiles.className='tiles';

    <div class="tile"><b>${cur==null?'—':Math.round(cur*100)+'%'}</b>

    <div class="tile"><b>${best}</b><span>längste Serie</span></div>
    <div class="tile"><b>${done[WEEKS-1]}</b><span>To-dos diese Woche erledigt</span></div>
    <div class="tile"><b>${S.tasks.length}</b><span>offen</span></div>`;

  const card=el('div');card.className='card';
  card.innerHTML=`<div class="cardhead"><h3>Routinen pro Bereich</h3>

  }

    </div>
    <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px">

/* Geometrie an einer Stelle, damit Zeichnen und Fadenkreuz nie auseinanderlaufen.
   Auf dem Handy wird das Diagramm relativ höher — sonst schrumpft der ganze
   Kasten auf Streichholzgröße und die Achsen sind nicht mehr lesbar. */
function chartGeom(series){
  const narrow=innerWidth<640;
  const label=!narrow&&series.length<=4;
  return{W:narrow?400:720,H:narrow?260:250,pl:narrow?30:36,pr:label?58:14,pt:14,pb:26,label,narrow};
}
function lineChart(series,ws){
  const g=chartGeom(series),{W,H,pl,pr,pt,pb}=g;
  const iw=W-pl-pr,ih=H-pt-pb,n=ws.length;
  const X=i=>pl+i*iw/(n-1), Y=v=>pt+(1-v/100)*ih;
  let grid='';
  [0,25,50,75,100].forEach(v=>{
    grid+=`<line class="gridline" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/>
      <text class="axis" x="${pl-8}" y="${Y(v)+3.5}" text-anchor="end">${v===100?'100%':v}</text>`;
  });
  let xl='';
  (g.narrow?[0,n-1]:[0,Math.floor((n-1)/2),n-1]).forEach(i=>{
    xl+=`<text class="axis" x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${weekLabel(ws[i])}</text>`;
  });
  let paths='',labels='';
  series.forEach(s=>{
    let d='',open=false;
    s.values.forEach((v,i)=>{
      if(v==null){open=false;return}
      d+=(open?' L':' M')+X(i)+','+Y(v);open=true;
    });
    paths+=`<path class="serie" d="${d.trim()}" stroke="${s.color}"/>`;
    /* Ein einzelner Punkt ergibt keine Linie und wäre sonst unsichtbar —
     am Anfang hat man aber genau das: eine Woche. */
    s.values.forEach((v,i)=>{
      if(v==null)return;
      const allein=(i===0||s.values[i-1]==null)&&(i===n-1||s.values[i+1]==null);
      if(allein)paths+=`<circle class="dot" cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}"/>`;
    });
    if(g.label){
      let li=-1;s.values.forEach((v,i)=>{if(v!=null)li=i});
      if(li>=0)labels+=`<text x="${X(li)+9}" y="${Y(s.values[li])+3.5}" font-size="11" font-weight="600"
        fill="var(--text-2)">${esc(s.name)}</text>`;
    }
  });
  const dots=series.map(s=>s.values.map((v,i)=>v==null?'':
    `<circle class="dot hv" data-i="${i}" cx="${X(i)}" cy="${Y(v)}" r="0" fill="${s.color}"/>`).join('')).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Erfüllungsquote pro Bereich über ${n} Wochen">
    ${grid}<line class="cross" id="cross" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" style="display:none"/>
    ${paths}${dots}${labels}${xl}
    <rect id="hit" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
}

function wireChart(){
  const svg=board.querySelector('svg.chart');if(!svg)return;
  const hit=svg.querySelector('#hit'),cross=svg.querySelector('#cross');
  const series=seriesForAreas(),ws=weekStarts(WEEKS),n=ws.length;
  const g=chartGeom(series);
  const box=()=>svg.getBoundingClientRect();
  const move=e=>{
    const b=box(),vb=svg.viewBox.baseVal;
    const x=(e.clientX-b.left)/b.width*vb.width;
    const pl=g.pl,iw=vb.width-pl-g.pr;
    let i=Math.round((x-pl)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    const cx=pl+i*iw/(n-1);
    cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.style.display='';
    svg.querySelectorAll('.hv').forEach(c=>c.setAttribute('r',+c.dataset.i===i?4.5:0));
    const rows=series.map(s=>s.values[i]==null?null
      :`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color}"></span> ${esc(s.name)} ${Math.round(s.values[i])}%`)
      .filter(Boolean);
    tip.innerHTML=`<b>${weekLabel(ws[i])}</b>${rows.length?'<br>'+rows.join('<br>'):'<br>nichts geplant'}`;
    tip.classList.add('on');
    tip.style.left=Math.min(innerWidth-tip.offsetWidth-10,Math.max(8,e.clientX-tip.offsetWidth/2))+'px';
    tip.style.top=Math.max(8,b.top-tip.offsetHeight-8)+'px';
  };
  const leave=()=>{cross.style.display='none';tip.classList.remove('on');
    svg.querySelectorAll('.hv').forEach(c=>c.setAttribute('r',0))};
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',leave);
  svg.addEventListener('pointerleave',leave);
}

/* =========================================================================
   BEREICHE — echte Mindmap: Fokus-Navigation, ziehbar, Unterbereiche,
   Querverbindungen. Angetippte Bubble rutscht in die Mitte.
   ========================================================================= */
const MW=940,MH=720,MCX=MW/2,MCY=MH/2,R1=200,RC=118,RF=232;
/* Mit dem Daumen trifft man keinen 15-Pixel-Knopf. Auf Touch-Geräten sind die
   Griffe größer und sitzen weiter außerhalb der Bubble — weiter außen, damit
   die vergrößerte Trefferfläche nicht die Bubble selbst verschluckt. */
const TOUCH=matchMedia('(pointer:coarse)').matches;
const PLUS={vis:TOUCH?18:12,hit:TOUCH?34:21,off:TOUCH?26:0};
const CUT={vis:TOUCH?16:10,hit:TOUCH?34:19};
const ALL={id:'_all',name:'alles',slot:null,parent:null};
let POS={},PREV=null,tween=null;

/* Welche Knoten sind gerade sichtbar?
   Ohne Fokus: die Gesamtkarte. Mit Fokus: der Knoten in der Mitte und seine
   Nachbarn im Graphen — Elternteil, Kinder, Querverbindungen. */
function graph(){
  /* Beim Verbinden zeigt die Karte alles — sonst könnte man nur Nachbarn
     verbinden, und genau die hängen ja schon zusammen. */
  if(!UI.pick||!areaOf(UI.pick)||UI.linking){
    const roots=S.areas.filter(a=>!a.parent);
    const ring=[];
    roots.forEach(r=>{ring.push(r);kidsOf(r.id).forEach(k=>ring.push(k))});
    return{center:ALL,ring,overview:true};
  }
  const a=areaOf(UI.pick),ring=[];
  ring.push(a.parent?areaOf(a.parent):ALL);
  kidsOf(a.id).forEach(k=>ring.push(k));
  /* Geschwister nur bei Unterbereichen — bei Oberbereichen wäre das die
     halbe Karte und der Fokus wäre keiner mehr. */
  if(a.parent)kidsOf(a.parent).forEach(k=>{if(k.id!==a.id)ring.push(k)});
  S.links.forEach(l=>{
    if(l.a===a.id&&areaOf(l.b))ring.push(areaOf(l.b));
    if(l.b===a.id&&areaOf(l.a))ring.push(areaOf(l.a));
  });
  const seen=new Set();
  return{center:a,ring:ring.filter(x=>x&&x.id!==a.id&&!seen.has(x.id)&&seen.add(x.id)),overview:false};
}

function layout(){
  const g=graph(),pos={_all:{x:MCX,y:MCY}};
  if(g.overview){
    const roots=S.areas.filter(a=>!a.parent),n=Math.max(roots.length,1);
    roots.forEach((r,i)=>{
      const base=(-90+i*360/n)*Math.PI/180;
      pos[r.id]=r.x!=null?{x:r.x,y:r.y}:{x:MCX+R1*Math.cos(base),y:MCY+R1*Math.sin(base)};
      const ang=Math.atan2(pos[r.id].y-MCY,pos[r.id].x-MCX);
      const kids=kidsOf(r.id);
      /* Je mehr Kinder, desto weiter draußen und desto breiter der Fächer. */
      const rad=RC+(kids.length-1)*24,arc=Math.min(58,20*kids.length)*Math.PI/180;
      kids.forEach((k,j)=>{
        const off=kids.length>1?(j-(kids.length-1)/2)*(arc/(kids.length-1)):0;
        pos[k.id]=k.x!=null?{x:k.x,y:k.y}
          :{x:pos[r.id].x+rad*Math.cos(ang+off),y:pos[r.id].y+rad*Math.sin(ang+off)};
      });
    });
    const list=S.areas.slice();
    const fixed=new Set(S.areas.filter(a=>a.x!=null).map(a=>a.id));
    return relax(pos,list,fixed);
  }
  /* Fokusmodus: Mitte ist der gewählte Knoten, Nachbarn gleichmäßig im Kreis.
     Gezogene Positionen gelten hier bewusst nicht — die Anordnung ergibt sich
     aus dem Fokus, sonst wäre sie bei jedem Sprung woanders. */
  pos[g.center.id]={x:MCX,y:MCY};
  const n=Math.max(g.ring.length,1);
  g.ring.forEach((k,i)=>{
    const ang=(-90+i*360/n)*Math.PI/180;
    pos[k.id]={x:MCX+RF*Math.cos(ang),y:MCY+RF*Math.sin(ang)};
  });
  return relax(pos,[g.center,...g.ring],new Set([g.center.id]));
}

/* Sanftes Auseinanderschieben: verhindert, dass Bubbles aufeinanderliegen.
   Manuell gezogene Knoten bleiben stehen — sonst würde die App die eigene
   Anordnung ständig wieder überschreiben. */
function relax(pos,list,fixed){
  const rOf=a=>nodeR(a,false)+9;
  for(let it=0;it<70;it++){
    let moved=0;
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const A=list[i],B=list[j],pa=pos[A.id],pb=pos[B.id];
      if(!pa||!pb)continue;
      const min=rOf(A)+rOf(B);
      let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy);
      if(d>=min)continue;
      if(d<.01){dx=Math.cos(i*2.4);dy=Math.sin(i*2.4);d=1}
      const push=(min-d)/2,ux=dx/d*push,uy=dy/d*push;
      const fa=fixed.has(A.id),fb=fixed.has(B.id);
      if(fa&&fb)continue;
      if(!fa){pa.x-=fb?ux*2:ux;pa.y-=fb?uy*2:uy}
      if(!fb){pb.x+=fa?ux*2:ux;pb.y+=fa?uy*2:uy}
      moved+=push;
    }
    if(moved<.4)break;
  }
  return pos;
}

const nodeR=(a,center)=>center?(a.id==='_all'?46:52):(a.id==='_all'?34:(a.parent?27:33));

function viewBereiche(){
  const g=graph();
  PREV=Object.keys(POS).length?{...POS}:null;
  POS=layout();

  const nodeIds=[g.center.id,...g.ring.map(r=>r.id)];
  const has=id=>nodeIds.includes(id);
  let edges='',nodes='';

  if(g.overview){
    S.areas.filter(a=>!a.parent).forEach(r=>{
      edges+=edge('_all',r.id,`var(--s${r.slot})`,1.8,.38);
      kidsOf(r.id).forEach(k=>edges+=edge(r.id,k.id,`var(--s${r.slot})`,1.4,.32));
    });
    S.links.forEach((l,i)=>{if(POS[l.a]&&POS[l.b])edges+=edge(l.a,l.b,'var(--muted)',1.6,.7,i)});
  } else {
    g.ring.forEach(k=>{
      const cross=S.links.some(l=>(l.a===g.center.id&&l.b===k.id)||(l.b===g.center.id&&l.a===k.id));
      const i=S.links.findIndex(l=>(l.a===g.center.id&&l.b===k.id)||(l.b===g.center.id&&l.a===k.id));
      edges+=edge(g.center.id,k.id,cross?'var(--muted)':colorOf(g.center.id),1.7,cross?.7:.38,cross?i:undefined);
    });
  }

  [[g.center,true],...g.ring.map(r=>[r,false])].forEach(([a,center])=>{
    const p=POS[a.id];if(!p)return;

  });

  const narrow=innerWidth<640;
  const wrap=el('div');wrap.className='card';
  wrap.innerHTML=`<div class="cardhead"><h3>${g.overview?'Deine Bereiche':esc(g.center.name)}</h3>
    <span class="sub">${UI.linking?'Zweiten Bereich antippen'
      :narrow?(g.overview?'ziehen · ＋ Unterbereich':'Mitte = zurück')
      :g.overview?'Bubbles ziehen · + für Unterbereich':'Mitte antippen führt zurück'}</span></div>
    <div class="mapwrap${narrow?' tall':''}">
      <svg class="map" viewBox="0 0 ${MW} ${MH}" role="img" aria-label="Mindmap der Bereiche"
           preserveAspectRatio="xMidYMid ${narrow?'slice':'meet'}">
        <g id="cam" transform="translate(${UI.cam.x},${UI.cam.y}) scale(${UI.cam.z})">${edges}${nodes}</g>
      </svg>
      <div class="zoom"><button data-z="1">+</button><button data-z="-1">−</button><button data-z="0" title="zurücksetzen">⤢</button></div>
    </div>
    <div class="hint">${UI.linking
      ? `<b>Verbinden:</b> tippe den Bereich an, mit dem „${esc(areaOf(UI.linking)?.name||'')}" verbunden werden soll.`
      : narrow
        ? (g.overview?'Antippen rückt in die Mitte · Ziehen ordnet neu an'
                     :'Nachbar antippen springt weiter · Mitte geht zurück')
        : g.overview
          ? 'Bubble antippen rückt sie in die Mitte. Ziehen ordnet die Gesamtkarte neu an.'
          : 'Nachbar antippen springt weiter. Mitte antippen geht eine Ebene zurück. Gestrichelt = Querverbindung.'}</div>`;
  board.appendChild(wrap);

  const tb=el('div');tb.className='toolbar';
  if(UI.pick&&areaOf(UI.pick)){
    const a=areaOf(UI.pick);
    tb.innerHTML=`<span style="font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:7px">
        <i class="swatch" style="background:${colorOf(a.id)}"></i>${esc(a.name)}</span>
      ${!a.parent?'<button data-form="child">＋ Unterbereich</button>':''}
      <button data-link="${a.id}" aria-pressed="${UI.linking===a.id}">🔗 Verbinden</button>
      <button data-form="rename">Umbenennen</button>
      ${!a.parent?'<button data-color="'+a.id+'">Farbe</button>':''}
      <button class="dan" data-delarea="${a.id}">Löschen</button>
      <button data-clear="1">Zur Gesamtkarte</button>`;
  } else {
    tb.innerHTML=`<button data-form="root">＋ Bereich</button>
      <button data-freeall="1">Aufräumen</button>`;
  }
  board.appendChild(tb);

  if(UI.form){
    const f=el('div');f.className='inline';
    f.innerHTML=`<input id="ainput" placeholder="${UI.form==='rename'?'Neuer Name':UI.form==='child'?'Name des Unterbereichs':'Name des Bereichs'}"
      value="${UI.form==='rename'?esc(areaOf(UI.pick)?.name||''):''}">
      <button data-save="1">Speichern</button>`;
    board.appendChild(f);
    setTimeout(()=>{const i=document.getElementById('ainput');if(i){i.focus();i.select()}},20);
  }

  if(UI.pick&&areaOf(UI.pick)){
    const ids=subtree(UI.pick);
    const rs=S.routines.filter(r=>ids.includes(r.areaId)),ts=S.tasks.filter(t=>ids.includes(t.areaId));
    const sec=el('section');
    sec.innerHTML=`<div class="sechead"><h2>${esc(pathName(UI.pick))}</h2>
      <span class="count">${ts.length+rs.length}</span></div><div class="list"></div>`;
    const list=sec.querySelector('.list');
    rs.forEach(r=>list.appendChild(routineRow(r)));
    ts.forEach(t=>list.appendChild(taskRow(t)));
    if(!rs.length&&!ts.length)list.innerHTML=
      '<div class="empty">Noch nichts hier drin. Tippe oben etwas — es landet automatisch hier.</div>';
    board.appendChild(sec);
  }
  wireMap();
  animateMap();
}

function edge(a,b,c,w,o,xi){
  let out=`<path class="edge${xi!==undefined?' xlink':''}" data-a="${a}" data-b="${b}"${xi!==undefined?` data-x="${xi}"`:''}
    d="${curve(POS[a],POS[b])}" fill="none" stroke="${c}" stroke-width="${w}" opacity="${o}"
    ${xi!==undefined?'stroke-dasharray="5 5"':''}/>`;
  if(xi!==undefined&&POS[a]&&POS[b]){
    /* Griff genau in der Mitte der Kurve — bei dieser Kontrollpunktwahl
       ist t=0.5 exakt der Mittelpunkt der Endpunkte. */
    const mx=(POS[a].x+POS[b].x)/2,my=(POS[a].y+POS[b].y)/2;
    out+=`<g class="cut" data-cut="${xi}" data-a="${a}" data-b="${b}" transform="translate(${mx},${my})"
        data-tip="Verbindung lösen">
      <circle r="${CUT.hit}" fill="transparent"/><circle class="cb" r="${CUT.vis}"/>
      <path d="M-${CUT.vis*0.5},0 H${CUT.vis*0.5}" fill="none"/></g>`;
  }
  return out;
}
function bubble(a,center,p){
  const all=a.id==='_all',R=nodeR(a,center);
  const c=all?'var(--muted)':colorOf(a.id);
  const ids=all?null:subtree(a.id);
  const cnt=all?S.tasks.length:S.tasks.filter(t=>ids.includes(t.areaId)).length;
  const rn=all?S.routines.length:S.routines.filter(r=>ids.includes(r.areaId)).length;
  const dim=UI.linking&&UI.linking!==a.id;
  const cap=(center||!a.parent||cnt||rn)?`${cnt} offen · ${rn} Rout.`:'';
  const max=center?18:(a.parent?13:15);
  const fs=center?16:(a.parent?11.5:13.5);
  return `<g class="node${dim?' dim':''}" data-area="${a.id}" transform="translate(${p.x},${p.y})">
    <circle class="bub" r="${R}" fill="${all?'var(--surface)':c}" fill-opacity="${all?1:(center?.34:.15)}"
      stroke="${all?'var(--line)':c}" stroke-width="${center?3:2}"/>
    <circle class="hit" r="${R+16}" fill="transparent"/>
    <text y="${center?5:3.8}" text-anchor="middle" font-size="${fs}" font-weight="600"
      fill="${all?'var(--muted)':'var(--text)'}">${esc(a.name.length>max?a.name.slice(0,max-1)+'…':a.name)}</text>
    ${cap&&!all?`<text y="${R+15}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${cap}</text>`:''}
    ${!all&&!a.parent?plusBtn(a.id,R):''}
  </g>`;
}
function plusBtn(id,R){
  const d=(R+PLUS.off)*0.72, k=PLUS.vis*0.46;
  return `<g class="plusbtn" data-plus="${id}" transform="translate(${d},${-d})">
    <circle r="${PLUS.hit}" fill="transparent"/><circle class="pb" r="${PLUS.vis}"/>
    <path d="M-${k},0 H${k} M0,-${k} V${k}" fill="none"/></g>`;
}
const curve=(p,q)=>p&&q?`M${p.x},${p.y} Q${(p.x+q.x)/2},${(p.y+q.y)/2} ${q.x},${q.y}`:'';

/* Umordnen wird getweent — ein Sprung ohne Bewegung lässt einen die Karte
   jedes Mal neu suchen. */
function animateMap(){
  const svg=board.querySelector('svg.map');if(!svg||!PREV)return;
  const from={},to={...POS};
  let any=false;
  Object.keys(to).forEach(id=>{
    if(PREV[id]&&(PREV[id].x!==to[id].x||PREV[id].y!==to[id].y)){from[id]=PREV[id];any=true}
    else from[id]=to[id];
  });
  if(!any)return;
  cancelAnimationFrame(tween);
  const t0=performance.now(),D=380;
  const step=now=>{
    const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);
    Object.keys(to).forEach(id=>{
      POS[id]={x:from[id].x+(to[id].x-from[id].x)*e,y:from[id].y+(to[id].y-from[id].y)*e};
      const g=svg.querySelector(`[data-area="${id}"]`);
      if(g)g.setAttribute('transform',`translate(${POS[id].x},${POS[id].y})`);
    });
    redrawEdges(svg);
    if(k<1)tween=requestAnimationFrame(step);
  };
  Object.keys(to).forEach(id=>{
    const g=svg.querySelector(`[data-area="${id}"]`);
    if(g)g.setAttribute('transform',`translate(${from[id].x},${from[id].y})`);
  });
  redrawEdges(svg);
  tween=requestAnimationFrame(step);
}

/* ---------- Ziehen, Schwenken, Zoomen ---------- */
function wireMap(){
  const svg=board.querySelector('svg.map');if(!svg)return;
  const cam=svg.querySelector('#cam');
  const overview=graph().overview;
  let drag=null,panning=null,moved=0;
  const toLocal=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    return p.matrixTransform(cam.getScreenCTM().inverse())};

  svg.addEventListener('pointerdown',e=>{
    const cut=e.target.closest('[data-cut]');
    if(cut){const i=+cut.dataset.cut,l=S.links[i];
      S.links.splice(i,1);say('Verbindung gelöst',()=>S.links.splice(i,0,l));render();return}
    const plus=e.target.closest('[data-plus]');
    if(plus){UI.pick=plus.dataset.plus;UI.form='child';render();return}
    const g=e.target.closest('[data-area]');
    moved=0;
    if(g){
      const id=g.dataset.area,p=toLocal(e);
      /* Die Mitte ist der Angelpunkt — sie lässt sich antippen, aber nicht ziehen. */
      drag=id==='_all'
        ? {id,g,fixed:true,sx:e.clientX,sy:e.clientY}
        : {id,g,dx:POS[id].x-p.x,dy:POS[id].y-p.y};
      if(!drag.fixed)g.classList.add('dragging');
    } else {
      panning={x:e.clientX,y:e.clientY,ox:UI.cam.x,oy:UI.cam.y};
      svg.classList.add('grabbing');
    }
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener('pointermove',e=>{
    if(drag&&drag.fixed){
      moved+=Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy);
      drag.sx=e.clientX;drag.sy=e.clientY;return;
    }
    if(drag){
      const p=toLocal(e),nx=p.x+drag.dx,ny=p.y+drag.dy;
      moved+=Math.abs(nx-POS[drag.id].x)+Math.abs(ny-POS[drag.id].y);
      POS[drag.id]={x:nx,y:ny};
      drag.g.setAttribute('transform',`translate(${nx},${ny})`);
      if(overview)moveKids(drag.id,svg);
      redrawEdges(svg);
    } else if(panning){
      UI.cam.x=panning.ox+(e.clientX-panning.x);
      UI.cam.y=panning.oy+(e.clientY-panning.y);
      moved+=Math.abs(e.clientX-panning.x)+Math.abs(e.clientY-panning.y);
      cam.setAttribute('transform',`translate(${UI.cam.x},${UI.cam.y}) scale(${UI.cam.z})`);
    }
  });

  svg.addEventListener('pointerup',()=>{
    svg.classList.remove('grabbing');
    if(drag){
      drag.g.classList.remove('dragging');
      const id=drag.id;
      if(moved<6){                                   /* Tippen, nicht Ziehen */
        drag=null;
        if(UI.linking&&UI.linking!==id&&id!=='_all'){
          const a=UI.linking,A=areaOf(a),B=areaOf(id);
          const related=A&&B&&(A.parent===B.id||B.parent===A.id);
          const exists=S.links.some(l=>(l.a===a&&l.b===id)||(l.a===id&&l.b===a));
          UI.linking=null;
          if(related)say('Die beiden hängen schon zusammen',null);
          else if(exists)say('Verbindung besteht bereits',null);
          else{S.links.push({a,b:id});say('Verbunden',()=>S.links.pop())}
        } else if(UI.linking===id){UI.linking=null}
        else if(id==='_all'){UI.pick=null;UI.form=null}
        else if(UI.pick===id){                       /* Mitte: eine Ebene zurück */
          const a=areaOf(id);UI.pick=a&&a.parent?a.parent:null;UI.form=null;
        } else {UI.pick=id;UI.form=null}
        return render();
      }
      /* Gezogene Positionen gelten nur für die Gesamtkarte */
      if(overview&&!drag.fixed){
        const a=areaOf(id);
        if(a){a.x=POS[id].x;a.y=POS[id].y;
          kidsOf(id).forEach(k=>{if(POS[k.id]){k.x=POS[k.id].x;k.y=POS[k.id].y}})}
      }
      drag=null;save();return;
    }
    panning=null;save();
  });
  svg.addEventListener('pointercancel',()=>{drag=null;panning=null;svg.classList.remove('grabbing')});

  board.querySelectorAll('.zoom button').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.z;
    if(d===0)UI.cam={x:0,y:0,z:1};
    else UI.cam.z=Math.min(2.4,Math.max(.5,UI.cam.z*(d>0?1.2:1/1.2)));
    cam.setAttribute('transform',`translate(${UI.cam.x},${UI.cam.y}) scale(${UI.cam.z})`);save();
  });
}
function moveKids(id,svg){
  const a=areaOf(id);if(!a||a.parent)return;
  const fresh=layout();
  kidsOf(id).forEach(k=>{
    if(k.x!=null||!fresh[k.id])return;
    const g=svg.querySelector(`[data-area="${k.id}"]`);if(!g)return;
    POS[k.id]=fresh[k.id];
    g.setAttribute('transform',`translate(${POS[k.id].x},${POS[k.id].y})`);
  });
}
function redrawEdges(svg){
  svg.querySelectorAll('.edge').forEach(p=>{
    const a=POS[p.dataset.a],b=POS[p.dataset.b];
    if(a&&b)p.setAttribute('d',curve(a,b));
  });
  svg.querySelectorAll('.cut').forEach(g=>{
    const a=POS[g.dataset.a],b=POS[g.dataset.b];
    if(a&&b)g.setAttribute('transform',`translate(${(a.x+b.x)/2},${(a.y+b.y)/2})`);
  });
}

board.addEventListener('click',e=>{
  /* --- Bereichs-Werkzeuge --- */
  const t=e.target.closest('button');
  if(t){
    if(t.dataset.form){UI.form=t.dataset.form;if(t.dataset.form==='root')UI.pick=null;return render()}
    if(t.dataset.save!==undefined){
      const v=document.getElementById('ainput').value.trim();
      if(v){
        if(UI.form==='rename'){areaOf(UI.pick).name=v}
        else{
          const parent=UI.form==='child'?UI.pick:null;
          const slot=parent?null:(S.areas.filter(a=>!a.parent).length%6)+1;
          const na={id:uid(),name:v,slot,parent,x:null,y:null};
          S.areas.push(na);UI.pick=na.id;
        }
      }
      UI.form=null;return render();
    }
    if(t.dataset.link){UI.linking=UI.linking===t.dataset.link?null:t.dataset.link;return render()}
    if(t.dataset.color){const a=areaOf(t.dataset.color);a.slot=(a.slot%6)+1;return render()}
    if(t.dataset.free){const a=areaOf(t.dataset.free);a.x=a.y=null;
      kidsOf(a.id).forEach(k=>{k.x=k.y=null});return render()}
    if(t.dataset.freeall){S.areas.forEach(a=>{a.x=a.y=null});UI.cam={x:0,y:0,z:1};
      say('Aufgeräumt',null);return render()}
    if(t.dataset.clear){UI.pick=null;UI.form=null;UI.linking=null;return render()}
    if(t.dataset.delarea){
      const id=t.dataset.delarea,snap=JSON.parse(JSON.stringify({a:S.areas,l:S.links}));
      const gone=subtree(id);
      S.areas=S.areas.filter(a=>!gone.includes(a.id));
      S.links=S.links.filter(l=>!gone.includes(l.a)&&!gone.includes(l.b));
      S.tasks.forEach(x=>{if(gone.includes(x.areaId))x.areaId=null});
      S.routines.forEach(x=>{if(gone.includes(x.areaId))x.areaId=null});
      UI.pick=null;say('Bereich gelöscht',()=>{S.areas=snap.a;S.links=snap.l});return render();
    }
    if(t.id==='tgtable'){UI.table=!UI.table;return render()}
    if(t.id==='closeimp'){UI.importer=false;return render()}
    if(t.dataset.csvclose){UI.csv=false;return render()}
    if(t.dataset.copy!==undefined){
      const x=csvFiles()[+t.dataset.copy];
      navigator.clipboard.writeText(x[2]).then(()=>say(x[0]+' kopiert',null))
        .catch(()=>say('Kopieren ging nicht',null));
      return;
    }
    if(t.dataset.file!==undefined){
      const x=csvFiles()[+t.dataset.file];
      share([[x[1],x[2],'text/csv;charset=utf-8']]);return;
    }
    if(t.id==='dopaste'){
      const v=document.getElementById('pastebox').value.trim();
      if(!v)return say('Nichts eingefügt',null);
      if(loadBackup(v))UI.importer=false;else say('Das war keine gültige Sicherung',null);
      return render();
    }
    if(t.id==='pickfile'){
      const f=el('input');f.type='file';f.accept='.json,application/json,text/plain';
      f.onchange=()=>{const r=new FileReader();
        r.onload=()=>{if(loadBackup(r.result)){UI.importer=false;render()}
          else say('Datei konnte nicht gelesen werden',null)};
        r.readAsText(f.files[0])};
      f.click();return;
    }
  }

  /* --- Querverbindung anklicken = lösen --- */
  const x=e.target.closest('.xlink');
  if(x){const i=+x.dataset.x,l=S.links[i];S.links.splice(i,1);
    say('Verbindung gelöst',()=>S.links.splice(i,0,l));return render()}

  const fold=e.target.closest('.sechead');
  if(fold&&fold.dataset.fold){UI.folded[fold.dataset.fold]=!UI.folded[fold.dataset.fold];return render()}

  /* --- Routine-Editor --- */
  const ed=e.target.closest('.editor');
  if(ed){
    const r=S.routines.find(z=>z.id===ed.dataset.edit);if(!r)return;
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.e==='close'){UI.editR=null;return render()}
    if(b.dataset.e==='del'){const i=S.routines.indexOf(r);S.routines.splice(i,1);
      UI.editR=null;say('Routine gelöscht',()=>S.routines.splice(i,0,r));return render()}
    if(b.dataset.s==='daily')r.sched={kind:'daily'};
    if(b.dataset.s==='werktags')r.sched={kind:'weekdays',days:[1,2,3,4,5]};
    if(b.dataset.s==='interval')r.sched={kind:'interval',n:r.sched.n||3};
    if(b.dataset.w!==undefined){
      const w=+b.dataset.w;
      let days=r.sched.kind==='weekdays'?[...r.sched.days]:[];
      days=days.includes(w)?days.filter(z=>z!==w):[...days,w].sort();
      r.sched=days.length?{kind:'weekdays',days}:{kind:'daily'};
    }
    return render();
  }

  const host=e.target.closest('[data-rid],[data-tid]');if(!host)return;

  /* --- Kästchen nachtragen --- */
  const c=e.target.closest('.cell');
  if(c&&host.dataset.rid&&c.dataset.day){
    const r=S.routines.find(z=>z.id===host.dataset.rid);
    const d=c.dataset.day;
    if(!r||diffDays(d,today())>0)return;
    if(r.log[d])delete r.log[d];else r.log[d]=1;
    return render();
  }

  if(host.dataset.rid){
    const r=S.routines.find(z=>z.id===host.dataset.rid);if(!r)return;
    if(e.target.closest('.box')){
      const T=today();
      if(r.log[T]){delete r.log[T];doneToday=Math.max(0,doneToday-1)}
      else{r.log[T]=1;doneToday++;const st=streak(r);say(st>1?`${st} Tage in Folge`:'Erledigt',()=>{delete r.log[T];doneToday--})}
      return render();
    }
    if(e.target.closest('.kill')){const i=S.routines.indexOf(r);S.routines.splice(i,1);
      say('Routine gelöscht',()=>S.routines.splice(i,0,r));return render()}
    /* Nur der Name öffnet den Editor. Vorher reichte ein Danebentippen auf ein
       Kästchen, und statt eines nachgetragenen Tages ging ein Formular auf. */
    if(host.classList.contains('rrow')&&e.target.closest('.rname')){UI.editR=r.id;return render()}
    return;
  }

  const tk=S.tasks.find(z=>z.id===host.dataset.tid);if(!tk)return;
  if(e.target.closest('.box')){
    host.classList.add('going');const i=S.tasks.indexOf(tk),D=today();doneToday++;
    S.doneLog[D]=(S.doneLog[D]||0)+1;
    setTimeout(()=>{S.tasks.splice(i,1);
      say('Erledigt',()=>{S.tasks.splice(i,0,tk);doneToday--;S.doneLog[D]=Math.max(0,(S.doneLog[D]||1)-1)});
      render()},220);
    return;
  }
  if(e.target.dataset.ics){ics(tk);return}
  if(e.target.closest('.kill')){const i=S.tasks.indexOf(tk);S.tasks.splice(i,1);
    say('Gelöscht',()=>S.tasks.splice(i,0,tk));return render()}
  const act=e.target.dataset.act;
  if(act){
    const before=tk.due;
    if(act==='today')tk.due=today();
    if(act==='week')tk.due=addDays(today(),7);
    if(act==='drop'){const i=S.tasks.indexOf(tk);S.tasks.splice(i,1);
      say('Weg.',()=>S.tasks.splice(i,0,tk));return render()}
    say('Neu angesetzt',()=>{tk.due=before});render();
  }
});

/* Tooltips sind eine Maus-Angelegenheit. Auf dem Touchscreen löst jede
   Berührung ein synthetisches mouseover aus — dann klebt eine Sprechblase über
   der Zeile, die man gerade antippen wollte. Also dort gar nicht erst zeigen.
   Das Fadenkreuz im Verlauf bleibt, das ist eine bewusste Geste. */
const HOVER=matchMedia('(hover:hover) and (pointer:fine)').matches;
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  if(!HOVER)return;
  const h=e.target.closest('[data-tip]');if(!h)return;
  tip.textContent=h.dataset.tip;tip.classList.add('on');
  const r=h.getBoundingClientRect();
  tip.style.left=Math.min(innerWidth-tip.offsetWidth-10,Math.max(8,r.left+r.width/2-tip.offsetWidth/2))+'px';
  tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';
});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.classList.remove('on')});
